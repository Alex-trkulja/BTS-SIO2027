<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title></title>
</head>
<body>
	<center>
		<h1> Ajout d'un nouveau véhicule </h1>

	
<table width="70%" border="0">

		<tr>

			<td> <label for="Marque"> Marque :</label> </td>
        	<td> <select id="Marque" name="Marque">
        			<option value="citröen"> citröen </option>
        			<option value="Renault"> Renault </option>
        			<option value="ferrari"> Ferrari </option>
        		</select> </td>

		</tr>

		<tr>

			<td> <label for="Immatriculation"> Immatriculation : </label> </td>
			<td> <input type="text" id="Immatriculation" name="Immatriculation"> </td>

		</tr>
		

		

		<tr>
			<td> <label for="couleur"> Couleur: </label> </td>
			<td> <input type="text" id="couleur" name="couleur"> </td>

		</tr>
		


		<tr>

			<td> <label for="date_immatriculation"> Date Immatriculation : </label> </td>
			<td> <input type="date" id="date_immatriculation" name="date_immatriculation"> </td>

		</tr>
		

		<tr>

			<td> <label for="Kilométrage"> Kilométrage :</label> </td>
        	<td> <input type="number" id="Kilométrage" name="Kilométrage"> </td>
        </tr>
       

        <tr>
        	<td> <p> État :</p> </td>
        	<td> <label for="Occasion"> Occasion</label> 
        	<input type="radio" id="Occasion"name="Occasion" > 
        	 <label for="neuf"> Neuf</label> 
        	<input type="radio" id="neuf" name="neuf"> </td>
       	</tr>
        

        <tr>
        	<td> <p> Carburant :</p> </td>
        	<td> <label for="Hybride "> Hybride </label> 
        	<input type="radio" id="Hybride "name="Hybride " > 
        	 <label for="Electrique "> Électrique </label> 
        	<input type="radio" id="Electrique" name="Electrique"> 
        	<label for="Diesel  "> Diesel  </label> 
        	<input type="radio" id="Diesel  "name="Diesel  " > 
        	 <label for="Essence "> Essence </label> 
        	<input type="radio" id="Essence" name="Essence"> </td>
        	</td>
        </tr>
        

        <tr>
        	<td> <label for="Boîte_de_vitesses"> Boîte de vitesses :</label> </td>
        	<td> <input type="text" id="Boîte_de_vitesses" name="Boîte_de_vitesses"> </td>
        </tr>
        

        <tr>
       		<td> <label for="porte"> Nombre de portes :</label> </td>
        	<td> <select id="porte" name="porte">
        			<option value="1"> 1 </option>
        			<option value="2"> 2 </option>
        			<option value="4"> 4 </option>
        		</select> 
        	</td>
        </tr>
        

        <tr>
        	<td> <label for="lieux"> Lieux achat : </label> </td>
        	<td> <textarea id="lieux" name="lieux" row="4" cols="30"> </textarea> </td>
        </tr>
        

        <tr>
        	<td> <label for="concessionnaire"> Nom du concessionnaire </label> </td>
        	<td>  <input type="text" id="concessionnaire" name="concessionnaire"> </td>
        </tr>
        

        
        

</table>
        <button type="submit"> Enregistrer </button>
        <button type="reset"> Annuler </button>

    </center>

</body>
</html>
