<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title></title>


</head>
<body background="img/monstre.jpg" style="color:white" >
	<strong>

<center>
	<header>
		<h1> Inscription d'un nouveau client </h1>
	</header>

	<section>
	<form action="#" method="post">

			
	<table width="70%" border="0">

		<tr>

			<td> <label for="nom"> Nom : </label> </td>
			<td> <input type="text" id="nom" name="nom"> </td>

		</tr>
		

		

		<tr>
			<td> <label for="prenom"> Prenom: </label> </td>
			<td> <input type="text" id="prenom" name="prenom"> </td>

		</tr>
		


		<tr>

			<td> <label for="date_naissance"> Date de naissance : </label> </td>
			<td> <input type="date" id="date_naissance" name="date_naissance"> </td>

		</tr>
		

		<tr>

			<td> <label for="email">Adresse mail :</label> </td>
        	<td> <input type="email" id="email" name="email"> </td>
        </tr>
       

        <tr>
        	<td> <label for="mdp">Mot de passe :</label> </td>
       		<td> <input type="password" id="mdp" name="mdp"> </td>
       	</tr>
        

        <tr>
        	<td> <label for="permis">Numéro de permis :</label> </td>
        	<td> <input type="text" id="permis" name="permis"> </td>
        </tr>
        

        <tr>
        	<td> <label for="anciennete">Nombre d'années d'ancienneté :</label> </td>
        	<td> <input type="number" id="anciennete" name="anciennete"> </td>
        </tr>
        

        <tr>
       		<td> <label for="ville"> Ville :</label> </td>
        	<td> <select id="ville" name="ville">
        			<option value="paris"> Paris </option>
        			<option value="versaille"> Versaille </option>
        			<option value="creteil"> Créteil </option>
        		</select> </td>
        </tr>
        

        <tr>
        	<td> <label for="adresse"> Adresse du client : </label> </td>
        	<td> <textarea id="adresse" name="adresse" row="4" cols="30"> </textarea> </td>
        </tr>
        

        <tr>
        	<td> <p> Situation matrimoniale :</p> </td>
        	<td> <label for="marie_oui"> Marié</label> 
        	<input type="radio" id="marie_oui"name="marié" value="oui"> 
        	 <label for="marie_non"> Non Marié</label> 
        	<input type="radio" id="marie_non" name="marie" value="non"> </td>
        </tr>
        

        <tr>
        	<td><p> Préférence de voiture :</p> </td>
        	<td> <label for="pref_auto"> Automatique</label> 
        	 <input type="checkbox" id="pref_auto" name="preference_auto" value="automatique"> 
        	 <label for="pref_manuelle"> Manuelle</label> 
        	 <input type="checkbox" id="pref_manuelle" name="preference_manuelle" value="manuelle"> </td>
        </tr>
        

</table>
        <button type="submit"> Enregistrer </button>
        <button type="reset"> Annuler </button>

    </form>

	</section>
</center>

	<footer> 
		<a href="index.html"> Retournée dans les listes de projets </a>
	</footer>
	</strong>

</body>
</html>
